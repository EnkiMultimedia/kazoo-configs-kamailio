#### rows affected by the last sql_query ####
## $sqlrows(con) needs a database module with DB_CAP_AFFECTED_ROWS, which
## db_sqlite does not have. These routes set $var(sqlrows) for the cb and exec
## connections; with db_sqlite they ask SQLite with changes(), which counts
## the rows changed by the last statement on the same connection.

route[KZ_SQL_ROWS_CB]
{
#!ifdef KZ_DB_NO_AFFECTED_ROWS
    $var(sqlrows) = 0;
    if(sql_xquery("cb", "select changes() as n", "kz_sqlrows") == 1) {
        $var(sqlrows) = $xavp(kz_sqlrows=>n);
    }
    pv_unset("$xavp(kz_sqlrows)");
#!else
    $var(sqlrows) = $sqlrows(cb);
#!endif
}

route[KZ_SQL_ROWS_EXEC]
{
#!ifdef KZ_DB_NO_AFFECTED_ROWS
    $var(sqlrows) = 0;
    if(sql_xquery("exec", "select changes() as n", "kz_sqlrows") == 1) {
        $var(sqlrows) = $xavp(kz_sqlrows=>n);
    }
    pv_unset("$xavp(kz_sqlrows)");
#!else
    $var(sqlrows) = $sqlrows(exec);
#!endif
}
