#### db_sqlite module ###
## Stock Kamailio replacement for db_kazoo, which is SQLite based.
## The database is created by db_scripts/create-kazoodb-sql.sh with
## DB_ENGINE=db_sqlite; queries are the db_kazoo ones.

loadmodule "db_sqlite.so"

## db_sqlite has no affected rows count, see sql-rows.cfg
#!define KZ_DB_NO_AFFECTED_ROWS

include_file "db_queries_kazoo.cfg"
